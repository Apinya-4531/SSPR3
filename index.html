const today = () => new Date().toISOString().slice(0, 10);
const addDays = (dateStr, days) => {
    const d = dateStr ? new Date(dateStr) : new Date();
    d.setDate(d.getDate() + Number(days || 0));
    return d.toISOString().slice(0, 10);
};
const daysUntil = (dateStr) => {
    if (!dateStr)
        return 999;
    const a = new Date(today());
    const b = new Date(dateStr);
    return Math.round((b - a) / 86400000);
};
const formatDate = (dateStr) => {
    if (!dateStr)
        return "-";
    try {
        return new Date(dateStr).toLocaleDateString("th-TH", { day: "2-digit", month: "short", year: "numeric" });
    }
    catch (e) {
        return dateStr;
    }
};
// Compact date for printed documents — e.g. "12 พ.ย. 69" instead of "12 พ.ย. 2569"
const formatDatePrint = (dateStr) => {
    if (!dateStr)
        return "-";
    try {
        return new Date(dateStr).toLocaleDateString("th-TH", { day: "2-digit", month: "short", year: "2-digit" });
    }
    catch (e) {
        return dateStr;
    }
};
const formatDateTime = (d) => {
    if (!d)
        return "-";
    try {
        const datePart = d.toLocaleDateString("th-TH", { day: "numeric", month: "numeric", year: "2-digit" });
        const timePart = d.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
        return `${datePart} ${timePart}`;
    }
    catch (e) {
        return "-";
    }
};
const genId = (prefix, list) => {
    const existing = new Set(list.map((x) => x.id));
    let n = list.length + 1;
    let id = `${prefix}-${String(n).padStart(4, "0")}`;
    while (existing.has(id)) {
        n += 1;
        id = `${prefix}-${String(n).padStart(4, "0")}`;
    }
    return id;
};
function pmStatusOf(pm) {
    const d = daysUntil(pm.nextDue);
    if (d < 0)
        return "overdue";
    if (d <= 7)
        return "soon";
    return "ok";
}
function partStatusOf(part) {
    if (Number(part.quantity) <= 0)
        return "out";
    if (Number(part.quantity) <= Number(part.minStock))
        return "low";
    return "ok";
}
// An asset's status is never stored/edited by hand — it's always derived live from
// its own work orders, so the two can never drift out of sync.
//   - Any open or in-progress BREAKDOWN work order  -> DOWN (unusable)
//   - Any IN-PROGRESS PM/CORRECTIVE work order       -> MAINT (being worked on)
//   - Only OPEN (not yet started) PM/CORRECTIVE, or no open work orders -> NORMAL
function deriveAssetStatus(assetId, workOrders) {
    const relevant = workOrders.filter((w) => w.assetId === assetId && (w.status === "OPEN" || w.status === "INPROGRESS"));
    if (relevant.length === 0)
        return "NORMAL";
    if (relevant.some((w) => w.type === "BREAKDOWN"))
        return "DOWN";
    if (relevant.some((w) => w.status === "INPROGRESS"))
        return "MAINT";
    return "NORMAL";
}

/* storage helpers — Firestore, real-time, shared by everyone                */
/* ------------------------------------------------------------------------ */
// Each "collection" (users, assets, work orders, ...) lives as ONE Firestore
// document at cmms/<key>, holding { items: [...] }. onSnapshot keeps every
// open browser in sync in real time: when one person saves, everyone else's
// screen updates automatically, no refresh needed.
function useFirestoreCollection(key, seedFn) {
    const [data, setData] = useState([]);
    const [loading, setLoading] = useState(true);
    const seededRef = useRef(false);
    useEffect(() => {
        seededRef.current = false;
        setLoading(true);
        const ref = doc(db, "cmms", key);
        const unsub = onSnapshot(ref, async (snap) => {
            if (snap.exists()) {
                setData(snap.data().items || []);
                setLoading(false);
            }
            else if (!seededRef.current) {
                // First time this Firebase project is used — plant the demo data once.
                seededRef.current = true;
                const seed = seedFn();
                try {
                    await setDoc(ref, { items: seed });
                }
                catch (e) {
                    console.error(`ไม่สามารถสร้างข้อมูลเริ่มต้นสำหรับ "${key}":`, e);
                    setData(seed);
                    setLoading(false);
                }
            }
        }, (err) => {
            console.error(`ไม่สามารถซิงก์ข้อมูล "${key}" กับ Firestore:`, err);
            setLoading(false);
        });
        return () => unsub();
    }, [key]);
    const update = (next) => {
        setData(next);
        setDoc(doc(db, "cmms", key), { items: next }).catch((e) => {
            console.error(`บันทึกข้อมูล "${key}" ไปยัง Firestore ไม่สำเร็จ:`, e);
        });
    };
    return [data, update, loading];
}

.btn { display: inline-flex; align-items: center; gap: 6px; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 13.5px; font-weight: 600; padding: 9px 14px; border-radius: 5px; border: 1px solid transparent; cursor: pointer; transition: background .12s, border-color .12s, color .12s; }

.search-select { position: relative; }

.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent-amber); }
.field textarea { resize: vertical; }

.modal-overlay { position: fixed; inset: 0; background: rgba(10,12,14,0.65); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.modal-panel { background: var(--bg-panel); border: 1px solid var(--border-steel-light); border-radius: 10px; width: 100%; max-width: 520px; max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.45); }
.modal-panel.modal-wide { max-width: 720px; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border-steel); }
.modal-header h3 { font-size: 16px; }
.modal-body { padding: 20px; overflow-y: auto; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--border-steel); display: flex; justify-content: flex-end; gap: 10px; }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text-tertiary); font-size: 13.5px; }

.login-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(circle at 50% 15%, #1e242a 0%, var(--bg-void) 60%); position: relative; }
.login-theme-toggle { position: absolute; top: 20px; right: 20px; background: var(--bg-panel); }
.login-card { width: 100%; max-width: 460px; background: var(--bg-panel); border: 1px solid var(--border-steel); border-radius: 16px; padding: 40px 36px; box-shadow: 0 24px 60px rgba(0,0,0,0.4); }
.login-brand { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 30px; }
.login-brand-mark { width: 64px; height: 64px; border-radius: 16px; background: #0B1E3D; display: flex; align-items: center; justify-content: center; color: #1A1300; margin-bottom: 16px; box-shadow: 0 10px 26px rgba(11,30,61,0.35); padding: 10px; }
.login-brand-mark img { width: 100%; height: 100%; object-fit: contain; }
.login-brand .t1 { font-family: 'Chakra Petch', sans-serif; font-size: 17px; font-weight: 700; }
.login-brand .t2 { font-size: 11.5px; color: var(--text-tertiary); margin-top: 3px; letter-spacing: 0.03em; }
.login-title { font-size: 24px; font-weight: 700; margin-bottom: 6px; font-family: 'Chakra Petch', sans-serif; text-align: center; }
.login-sub { color: var(--text-secondary); font-size: 13.5px; margin-bottom: 26px; line-height: 1.5; text-align: center; }
.user-pick { display: flex; align-items: center; gap: 14px; background: var(--bg-panel); border: 1px solid var(--border-steel); border-radius: 10px; padding: 16px; margin-bottom: 12px; cursor: pointer; transition: border-color .12s, background .12s, transform .12s; }
.user-pick:hover { border-color: var(--accent-amber); background: var(--bg-panel-raised); transform: translateY(-1px); }
.user-pick .info { flex: 1; min-width: 0; }
.user-pick .info .n { font-weight: 700; font-size: 15px; }
.user-pick .info .r { font-size: 12.5px; color: var(--text-tertiary); margin-top: 2px; }
.user-pick .pick-chevron { flex-shrink: 0; }
.page-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.page-chip { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; background: var(--bg-input); border: 1px solid var(--border-steel); color: var(--text-secondary); white-space: nowrap; }

.comment { padding: 10px 0; border-bottom: 1px solid var(--border-steel); }
.comment:last-child { border-bottom: none; }
.comment .meta { font-size: 11.5px; color: var(--text-tertiary); margin-bottom: 3px; }

.print-paper { background: #F7F5F0; color: #1A1A1A; border-radius: 6px; padding: 30px; font-family: 'IBM Plex Sans Thai', sans-serif; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); }
.print-paper h2 { font-family: 'Chakra Petch', sans-serif; font-size: 20px; color: #1A1A1A; }
.print-paper table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 13px; }
.print-paper th, .print-paper td { border: 1px solid #CFC9BC; padding: 8px 10px; text-align: left; vertical-align: top; }
.print-paper th { background: #EDEAE2; font-weight: 600; white-space: nowrap; }
.print-paper .mono { font-family: 'JetBrains Mono', monospace; }
.print-doc-badge { display: inline-block; border: 2px solid var(--accent-amber); color: #9C6B05; background: #FFF6E4; font-weight: 700; font-size: 13px; padding: 6px 16px; border-radius: 6px; white-space: nowrap; }
.print-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 32px; margin-bottom: 20px; }
.print-info-item { display: flex; align-items: flex-start; gap: 8px; }
.print-info-item .k { font-size: 11.5px; color: #6B6B6B; margin-bottom: 2px; }
.print-info-item .v { font-size: 13.5px; font-weight: 600; color: #1A1A1A; }
.print-signatures { display: flex; justify-content: space-between; gap: 20px; margin-top: 54px; flex-wrap: wrap; }
.print-sign-block { text-align: center; flex: 1; min-width: 140px; }
.print-sign-line { border-top: 1px dotted #6B6B6B; margin-top: 46px; padding-top: 6px; font-size: 12.5px; color: #333; font-weight: 600; }
.print-sign-date { font-size: 11.5px; color: #888; margin-top: 4px; }

/* Receive/Issue/Work-order slips: laid out to fit one A5-landscape sheet.
   The box is NOT given a fixed height — it sizes to its own content. A fixed
   height here is what caused a 2nd, mostly-blank page: if the printer/driver
   doesn't actually hand the page the exact A5 dimensions we assume (common —
   many printers don't offer true A5 and silently substitute another size),
   a box that insists on being exactly "one A5 page tall" can end up taller
   than the real printable area and spill its bottom half onto a second
   sheet. Sizing to content instead means it only ever needs as much height
   as it truly uses, so it fits even on a page smaller than assumed. */
.print-a5 { display: flex; flex-direction: column; padding: 20px 24px; }
.print-a5-body { flex: 1 1 auto; }
.print-a5 .print-info-grid { gap: 10px 24px; margin-bottom: 12px; }
.print-a5 table { margin: 10px 0; font-size: 12px; }
.print-a5 th, .print-a5 td { padding: 6px 9px; }
.print-a5 .print-signatures { margin-top: 20px; }
.print-a5 .print-sign-block { min-width: 110px; }
.print-a5 .print-sign-line { margin-top: 26px; }

@media print {
  .print-a5 { width: 194mm; box-sizing: border-box; padding: 6mm 9mm; }
}

@media print {
  .cmms-root > .app-shell { display: none !important; }
  .cmms-root .modal-overlay:not(.print-modal-overlay) { display: none !important; }
  .cmms-root .no-print { display: none !important; }
  .cmms-root .print-modal-overlay { position: static !important; background: none !important; padding: 0 !important; display: block !important; }
  .cmms-root .print-modal-overlay .modal-panel { max-width: none !important; max-height: none !important; box-shadow: none !important; border: none !important; width: 100% !important; }
  .cmms-root .print-modal-overlay .modal-body { overflow: visible !important; padding: 0 !important; }
  .print-paper { box-shadow: none !important; }
}

@media (max-width: 860px) {
  .app-shell { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: relative; flex-direction: row; align-items: center; padding: 12px; overflow-x: auto; }
  .brand { padding: 0 12px 0 0; }
  .nav { flex-direction: row; overflow-x: auto; }
  .nav-item { flex-shrink: 0; border-left: none; border-bottom: 3px solid transparent; }
  .nav-item.active { border-left: none; border-bottom: 3px solid var(--accent-amber); }
  .sidebar-foot { display: none; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .grid-2 { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .content { padding: 16px; }
  .topbar { padding: 14px 16px; }
}
@media (max-width: 520px) {
  .kpi-row { grid-template-columns: 1fr; }
}
